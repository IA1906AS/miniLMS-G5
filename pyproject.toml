[project]
name = "uv-demo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JakeWalker", email = "lalala02070@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1.8",
    "uvicorn>=0.54.0",
]

[project.scripts]
uv-demo = "uv_demo:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (sắp xếp import)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade (cú pháp Python hiện đại)
]
ignore = [
    "B008",  # do not perform function calls in argument defaults (FastAPI Depends idiom)
    "E501",  # line length handled by ruff format
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
files = ["src", "tests"]


[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q --cov=src/uv_demo --cov-report=term-missing"
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/uv_demo"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

