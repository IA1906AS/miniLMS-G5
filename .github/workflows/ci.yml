name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công trên tab Actions

jobs:
  quality:
    name: Lint, type-check & test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Ruff - lint
        run: uv run ruff check --output-format=github

      - name: Ruff - format check
        run: uv run ruff format --check --diff

      - name: mypy - type check
        run: uv run mypy

      - name: pytest - unit tests & coverage
        run: uv run pytest

      - name: pip-audit - security scan
        run: uv run pip-audit

  security-scan:
    name: Semgrep SAST Security Scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST Scan
        run: |
          semgrep scan --config "p/default" --config "p/security-audit" --config .semgrep.yml --error src/


