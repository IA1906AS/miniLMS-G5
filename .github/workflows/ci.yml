name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.13.1"
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Ruff - lint
        run: uv run ruff check . --output-format=github

      - name: Ruff - format
        run: uv run ruff format --check --diff .

      - name: mypy - type check
        run: uv run mypy

      - name: pytest - tests and coverage
        run: uv run pytest --cov=minilms --cov-report=term-missing
